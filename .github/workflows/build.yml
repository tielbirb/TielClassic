name: Build TielClassic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mojo_ref:
        description: "MojoLauncher branch or tag to build on"
        default: v3_openjdk
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MOJO_REPO: https://github.com/MojoLauncher/MojoLauncher

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Clone MojoLauncher (with submodules)
        env:
          MOJO_REF: ${{ github.event.inputs.mojo_ref || 'v3_openjdk' }}
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch "$MOJO_REF" "$MOJO_REPO" mojo
          git -C mojo log -1 --format='MojoLauncher commit %H'

      - name: Generate and Apply TielClassic overlay
        run: |
          # 1. Create the missing script dynamically
          mkdir -p scripts
          cat << 'EOF' > scripts/apply_overlay.py
          import sys, shutil, os

          def main():
              if len(sys.argv) < 2:
                  print("Usage: apply_overlay.py <target_dir>")
                  sys.exit(1)
                  
              target_dir = sys.argv[1]
              # We assume your overlay files are in an "overlay" folder in your repo
              overlay_src = "overlay" 
              
              if os.path.isdir(overlay_src):
                  print(f"Applying overlay from ./{overlay_src} to {target_dir}...")
                  for item in os.listdir(overlay_src):
                      src = os.path.join(overlay_src, item)
                      dst = os.path.join(target_dir, item)
                      if os.path.isdir(src):
                          shutil.copytree(src, dst, dirs_exist_ok=True)
                      else:
                          shutil.copy2(src, dst)
                  print("Overlay applied successfully!")
              else:
                  print(f"Warning: '{overlay_src}' directory not found in repo. Skipping overlay.")
                  print("Create an 'overlay' folder in your repository with your mods/resources to use this.")

          if __name__ == "__main__":
              main()
          EOF

          # 2. Run the script
          python3 scripts/apply_overlay.py mojo

      - name: Get LTW renderer (optional)
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: mojo/app_mojo/libs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK
        working-directory: mojo
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: gradle :app_mojo:assembleFullDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp mojo/app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk out/TielClassic-debug.apk
          sha256sum out/TielClassic-debug.apk | tee out/TielClassic-debug.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TielClassic-debug
          path: out/*
          if-no-files-found: error
